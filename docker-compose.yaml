services:

  postgres:

    image: postgres:17-alpine

    container_name: ree_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${PG_ADMIN_USER}
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD}

    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_ADMIN_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:

  postgres_data:
  
